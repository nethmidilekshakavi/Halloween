        .winglow{position:absolute;border-radius:50%;opacity:0;pointer-events:none;
          background:radial-gradient(circle,#fff3c9 0%,rgba(255,170,60,.85) 35%,transparent 70%);transition:opacity .35s}
        .winglow.on{opacity:1}
        .fall{position:fixed;top:-6vh;width:10px;height:14px;border-radius:0 70% 0 70%;background:#d9570b;opacity:.8;z-index:2;pointer-events:none;animation:fall linear infinite}
        @keyframes fall{to{transform:translate(60px,112vh) rotate(420deg)}}
        .bat{position:fixed;left:0;top:0;width:96px;z-index:5;pointer-events:none;opacity:0;fill:var(--ink);filter:drop-shadow(0 0 10px rgba(255,150,40,.95))}
        .bat .wl,.bat .wr{transform-box:fill-box;animation:flap .3s ease-in-out infinite alternate}
        .bat .wl{transform-origin:100% 50%}.bat .wr{transform-origin:0% 50%;animation-name:flapr}
        @keyframes flap{from{transform:rotate(-24deg) scaleY(1)}to{transform:rotate(18deg) scaleY(.6)}}
        @keyframes flapr{from{transform:rotate(24deg) scaleY(1)}to{transform:rotate(-18deg) scaleY(.6)}}
        .hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:15px;letter-spacing:.08em;color:var(--amber);opacity:.7;z-index:6;transition:opacity .6s;text-shadow:0 0 6px #000}
        .flashscreen{position:fixed;inset:0;background:radial-gradient(circle,#fff0c0,var(--flame));opacity:0;pointer-events:none;z-index:7}

        /* invitation — glowing arched doorway room */
        .invite{position:fixed;inset:0;z-index:8;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity 1.2s ease;background:#140805}
        .invite.show{opacity:1;visibility:visible}
        .stage{position:relative;height:100%;min-height:790px;overflow:hidden}
        .wall{position:absolute;inset:0;background:
          repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 2px,transparent 2px 98px),
          radial-gradient(70% 60% at 50% 38%,#7c3209 0%,#3b1405 42%,#150704 78%)}
        .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.6))}
        .floor{position:absolute;left:0;right:0;bottom:0;height:22%;box-shadow:0 -30px 70px rgba(255,120,20,.12);background:
          repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 100px),linear-gradient(180deg,#1b0e08,#070302)}
        .arch{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:min(580px,94vw);height:94%;overflow:visible;
          filter:drop-shadow(0 0 14px rgba(255,140,40,.75)) drop-shadow(0 0 40px rgba(255,110,10,.35))}
        .arch path{fill:none;vector-effect:non-scaling-stroke}
        .arch .a1{stroke:#ff9a3c;stroke-width:5}
        .arch .a2{stroke:#d9a24a;stroke-width:1.5;opacity:.65}
        .card{position:relative;width:100%;transform:scale(.94);padding:38px 24px 28px;text-align:center;
          background:linear-gradient(180deg,rgba(36,11,22,.94),rgba(22,6,14,.97));border:1.5px solid #f0b04a;border-radius:20px;
          box-shadow:0 0 34px rgba(255,150,40,.22),inset 0 0 40px rgba(255,120,20,.06);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
        .invite.show .card{transform:none}
        .col{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,86vw);display:flex;flex-direction:column;align-items:center;gap:6px}
        .brand{display:block;width:min(230px,60vw);height:auto;opacity:0;transform:translateY(-8px);filter:drop-shadow(0 0 12px rgba(255,170,60,.45))}
        .invite.show .brand{animation:up .9s .1s cubic-bezier(.2,.8,.2,1) forwards}
        .card>*{opacity:0;transform:translateY(12px)}
        .invite.show .card>*{animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
        .invite.show .card>*:nth-child(2){animation-delay:.25s}.invite.show .card>*:nth-child(3){animation-delay:.4s}
        .invite.show .card>*:nth-child(4){animation-delay:.55s}.invite.show .card>*:nth-child(5){animation-delay:.65s}
        .invite.show .card>*:nth-child(6){animation-delay:.75s}.invite.show .card>*:nth-child(7){animation-delay:.85s}
        .invite.show .card>*:nth-child(8){animation-delay:.95s}.invite.show .card>*:nth-child(9){animation-delay:1.05s}
        .invite.show .card>*:nth-child(10){animation-delay:1.15s}.invite.show .card>*:nth-child(11){animation-delay:1.25s}
        @keyframes up{to{opacity:1;transform:none}}
        .ghost{position:absolute;right:-26px;top:0;width:64px;animation:bob 3.6s ease-in-out infinite}
        .invite.show .card>.ghost{animation:bob 3.6s ease-in-out infinite;opacity:.92;transform:none}
        @keyframes bob{50%{transform:translateY(-7px)}}
        .pre{font-size:.72rem;letter-spacing:.3em;color:#e7a53a;font-weight:500}
        h1{font-family:"Cinzel Decorative",Georgia,serif;font-weight:900;font-size:clamp(2.6rem,10vw,4rem);line-height:.98;margin:8px 0 14px;color:#ffb347;
          text-shadow:0 0 14px rgba(255,150,40,.9),0 0 38px rgba(255,100,0,.55)}
        .gems{color:#f0b04a;letter-spacing:.9em;font-size:.8rem;margin:0 0 14px .9em}
        .lab{font-size:.62rem;letter-spacing:.28em;color:#e7a53a;font-weight:500;margin-top:10px}
        .val{font-family:"Cinzel Decorative",Georgia,serif;font-weight:700;font-size:clamp(1rem,4.2vw,1.2rem);color:#fff3e0;margin-top:5px;line-height:1.35}
        .tag{margin-top:18px;font-size:.88rem;color:#ffb347}
        .cd{margin-top:10px;font-size:.78rem;letter-spacing:.06em;color:#e7a53a}
        .cd b{font-weight:600;color:#fff3e0}
        .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
        .btn{font:600 .92rem "Poppins",sans-serif;border-radius:999px;padding:13px 26px;cursor:pointer;margin:0;transition:transform .2s,box-shadow .2s}
        .btn:hover{transform:translateY(-2px)}
        .btn.p{border:0;color:#2a0f05;background:linear-gradient(90deg,#ffb347,#ff7a1a);box-shadow:0 0 22px rgba(255,140,40,.6)}
        .btn.p:hover{box-shadow:0 0 32px rgba(255,140,40,.9)}
        .btn.g{color:#ffe2c0;background:transparent;border:1.5px solid #e7a53a}
        .btn.g:hover{background:rgba(231,165,58,.12)}
        .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
        .candle{position:absolute;bottom:6%;width:24px;border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,#d9c79a,#fff6dc 45%,#e9d8ad);box-shadow:0 0 22px rgba(255,200,100,.22)}
        .candle::before{content:"";position:absolute;left:50%;top:-27px;width:13px;height:24px;margin-left:-6.5px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
          background:radial-gradient(ellipse at 50% 75%,#fff2b8,#ffb030 50%,#ff6a10 85%);filter:drop-shadow(0 0 10px #ff9a2e);animation:cf .8s ease-in-out infinite alternate}
        @keyframes cf{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
        .candle.c1{left:3vw;height:80px}.candle.c2{left:19vw;height:52px}.candle.c3{right:19vw;height:58px}.candle.c4{right:3vw;height:96px}
        .pk{position:absolute;bottom:5%;animation:pglow 2.6s ease-in-out infinite}
        .pk.l1{left:7vw;width:clamp(72px,10vw,124px)}.pk.l2{left:24vw;width:clamp(44px,6vw,70px);bottom:4%;animation-delay:-1s}
        .pk.r1{right:7vw;width:clamp(72px,10vw,124px);animation-delay:-.6s}.pk.r2{right:24vw;width:clamp(44px,6vw,70px);bottom:4%;animation-delay:-1.6s}
        @keyframes pglow{0%,100%{filter:drop-shadow(0 0 14px rgba(255,110,20,.55))}50%{filter:drop-shadow(0 0 28px rgba(255,150,30,.95))}}
        @media (max-width:640px){
          .candle.c2,.candle.c3,.pk.l2,.pk.r2{display:none}
          .pk.l1{left:3vw;width:24vw}.pk.r1{right:3vw;width:24vw}
          .candle.c1{left:31vw}.candle.c4{right:31vw}
          .ghost{right:-16px;width:54px}
        }
        .ember{position:fixed;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#ffb347;box-shadow:0 0 8px 2px #ff9a2e;z-index:9;pointer-events:none;opacity:0;animation:rise linear infinite}
        @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-105vh) translateX(30px);opacity:0}}
        .pop{position:fixed;z-index:20;font-size:22px;pointer-events:none;animation:pop 1.5s ease-out forwards}
        @keyframes pop{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--dx)),-150px) scale(1.2);opacity:0}}
        @media (prefers-reduced-motion:reduce){.ember,.fall,.ghost,.candle::before,.pk{animation:none}.card>*{opacity:1;transform:none;animation:none!important}}
    </style>
</head>

<script>
    (function(){
      var EVENT = new Date(new Date().getFullYear() > 2026 ? new Date().getFullYear() : 2026, 9, 31, 0, 0, 0);
      var $ = function(id){return document.getElementById(id)};
      var world=$('world'), bg=$('bg'), bat=$('bat'), glow=$('winglow'), invite=$('invite'), flash=$('flash'), hint=$('hint');
      var timers=[], raf=0, done=false;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var IW=1200, IH=1800;
      var G=IW/1200, GY=IH/1800, DOOR=[583*G,1050*GY];
      /* flight path in image coordinates: up the cobblestone path, through the gate, to the door */
      var PTS=[[610,2150],[620,1850],[640,1650],[620,1500],[600,1400],[620,1300],[592,1220],[584,1130],[583,1062]].map(function(p){return [p[0]*G,p[1]*GY]});

      function spline(P,u){
        var n=P.length-1, f=Math.min(u,.9999)*n, i=Math.floor(f), t=f-i;
        var p0=P[Math.max(i-1,0)],p1=P[i],p2=P[i+1],p3=P[Math.min(i+2,n)];
        var c=function(a,b,c2,d){return .5*((2*b)+(-a+c2)*t+(2*a-5*b+4*c2-d)*t*t+(-a+3*b-3*c2+d)*t*t*t)};
        return [c(p0[0],p1[0],p2[0],p3[0]), c(p0[1],p1[1],p2[1],p3[1])];
      }

      for(var i=0;i<14;i++){
        var e=document.createElement('div'); e.className='ember';
        e.style.left=(Math.random()*100)+'vw';
        e.style.animationDuration=(7+Math.random()*8)+'s';
        e.style.animationDelay=(-Math.random()*12)+'s';
        document.body.appendChild(e);
      }
      for(var j=0;j<12;j++){
        var l=document.createElement('div'); l.className='fall';
        l.style.left=(Math.random()*100)+'vw';
        l.style.animationDuration=(9+Math.random()*9)+'s';
        l.style.animationDelay=(-Math.random()*14)+'s';
        l.style.background=['#d9570b','#b8400a','#e8872a'][j%3];
        document.body.appendChild(l);
      }


      function tick(){
        var ms=EVENT-new Date();
        if(ms<=0){ ['d','h','m','s'].forEach(function(k){$(k).textContent='0'}); return; }
        var p=function(n){return String(n).padStart(2,'0')};
        $('d').textContent=Math.floor(ms/864e5);
        $('h').textContent=p(Math.floor(ms%864e5/36e5));
        $('m').textContent=p(Math.floor(ms%36e5/6e4));
        $('s').textContent=p(Math.floor(ms%6e4/1e3));
      }
      tick(); setInterval(tick,1000);

      function later(fn,ms){timers.push(setTimeout(fn,ms))}
      function showInvite(){ if(done) return; done=true; hint.style.opacity=0; invite.classList.add('show'); }
      var camPlace=null;
      function skip(){
        timers.forEach(clearTimeout); cancelAnimationFrame(raf); bat.style.opacity=0;
        if(camPlace){ var c=camPlace(1); world.style.transformOrigin=c.dx+'px '+c.dy+'px'; }
        world.style.transition=''; world.classList.add('zoom'); showInvite();
      }

      function play(){
        timers.forEach(clearTimeout); timers=[]; cancelAnimationFrame(raf);
        done=false; invite.classList.remove('show'); glow.classList.remove('on');
        world.style.transition='none'; world.style.transform=''; world.classList.remove('zoom'); void world.offsetWidth;
        flash.style.transition='none'; flash.style.opacity=0; hint.style.opacity=.7; bat.style.opacity=0;
        if(reduce){ world.style.transition=''; world.classList.add('zoom'); showInvite(); return; }

        var W=innerWidth, H=innerHeight, s=Math.max(W/IW,H/IH);
        bg.style.width=(IW*s)+'px'; bg.style.height=(IH*s)+'px';

        /* camera: starts at the foreground path, follows the bat up to the door, pushing in slowly */
        function place(e){
          var Z=1+.25*e, zs=Z*s, q=spline(PTS,e);
          var ty=H*(.7-.15*e)-zs*q[1];
          ty=Math.min(0,Math.max(H-zs*IH,ty));
          var tx=(W-zs*IW)/2;
          bg.style.transform='translate('+tx+'px,'+ty+'px) scale('+Z+')';
          return {bx:tx+zs*q[0], by:ty+zs*q[1], dx:tx+zs*DOOR[0], dy:ty+zs*DOOR[1], zs:zs};
        }
        camPlace=place; place(0);

        var k=Math.max(1.2,Math.min(W/260,H/400,2.2)), DUR=9000, DEL=1000, t0=null;
        var endSc=Math.max(.1,.7*85*G*s*1.25/96), startSc=k*1.3;
        function frame(now){
          if(t0===null) t0=now;
          var el=now-t0-DEL;
          if(el<0){ raf=requestAnimationFrame(frame); return; }
          var t=Math.min(1,el/DUR), e=t*t*(3-2*t), c=place(e);
          var sc=startSc+(endSc-startSc)*Math.pow(e,.8);
          bat.style.transform='translate('+(c.bx-48)+'px,'+(c.by-24)+'px) scale('+sc+')';
          bat.style.opacity=Math.min(1,t/.05,(1-t)/.04);
          if(t<1){ raf=requestAnimationFrame(frame); return; }
          bat.style.opacity=0;
          var gs=260*G*c.zs;
          glow.style.left=c.dx+'px'; glow.style.top=c.dy+'px';
          glow.style.width=glow.style.height=gs+'px'; glow.style.margin=(-gs/2)+'px 0 0 '+(-gs/2)+'px';
          world.style.transformOrigin=c.dx+'px '+c.dy+'px'; world.style.transition='';
          glow.classList.add('on');
          later(function(){world.classList.add('zoom')},400);
          later(function(){flash.style.transition='opacity .9s';flash.style.opacity=.85},1400);
          later(function(){showInvite();flash.style.transition='opacity 1.6s';flash.style.opacity=0},2300);
        }
        raf=requestAnimationFrame(frame);
      }
      document.addEventListener('click',function(ev){ if(!done) skip(); });
      $('leave').addEventListener('click',function(ev){ev.stopPropagation();play()});
      $('rsvp').addEventListener('click',function(ev){
        ev.stopPropagation(); var b=ev.currentTarget; b.textContent="🎉 See you there!";
        var r=b.getBoundingClientRect();
        ['🎃','🦇','👻','✨','🎃','🦇','👻','✨'].forEach(function(em,i){
          var d=document.createElement('span'); d.className='pop'; d.textContent=em;
          d.style.left=(r.left+r.width/2)+'px'; d.style.top=r.top+'px';
          d.style.setProperty('--dx',((i-3.5)*34)+'px'); d.style.animationDelay=(i*40)+'ms';
          document.body.appendChild(d); setTimeout(function(){d.remove()},1800);
        });
      });
      addEventListener('resize',function(){ if(!done) play(); });
      play();
    })();
</script>
</body>
</html>
